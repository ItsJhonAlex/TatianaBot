services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: tatiana-lavalink
    restart: unless-stopped
    ports:
      - "2333:2333"
    volumes:
      - ./docker/lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - ./data/music-cache:/music-cache
    environment:
      - _JAVA_OPTIONS=-Xmx512M
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -qO- --header="Authorization: youshallnotpass" http://127.0.0.1:2333/version || exit 1',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
